# Ultramarine Server: serve Caddy's admin API on a Unix socket instead of
# localhost:2019, so only Caddy and root (Tetra) can reconfigure it.
# `caddy reload` (ExecReload) reads CADDY_ADMIN too, so it uses the socket.
[Service]
Environment=CADDY_ADMIN=unix//run/caddy/admin.sock
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
