# Ultramarine falcond defaults. Per-game profiles go in /usr/share/falcond/profiles.
enable_performance_mode = true
# Leave the scheduler alone when idle so scx_loader's default (scx_lavd, Auto)
# stays in charge. Profiles that set scx_sched switch it while the game runs,
# and falcond restores whatever scx_loader was running when the game exits.
scx_sched = none
scx_sched_props = default
vcache_mode = none
profile_mode = none
