
[jobs]
symbol = "+"
number_threshold = 4
symbol_threshold = 1

[hostname]
ssh_only = false
format = "[$ssh_symbol](bold blue)@[$hostname](bold blue) "
disabled = false

[username]
style_user = "bold"
format = "[$user]($style)"
disabled = false
show_always = true

[directory]
truncation_symbol = "…/"
